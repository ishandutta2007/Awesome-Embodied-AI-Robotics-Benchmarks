<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#050714" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .signal-line {
        stroke-dasharray: 8 12;
        animation: flowSignal 25s linear infinite;
      }
      .shimmer-badge {
        animation: shimmer 4s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -30px) scale(1.2); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.5; }
        50% { r: 6.5px; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes flowSignal {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmer {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6)); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="110" r="160" fill="url(#glowGrad1)" filter="url(#blurGlow)" class="glow-orb-1" />
  <circle cx="1020" cy="300" r="180" fill="url(#glowGrad2)" filter="url(#blurGlow)" class="glow-orb-2" />

  <!-- Dynamic Cybernetic Grid Mesh & Constellation -->
  <g opacity="0.15">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150,0 L 150,420 M 300,0 L 300,420 M 450,0 L 450,420 M 600,0 L 600,420 M 750,0 L 750,420 M 900,0 L 900,420 M 1050,0 L 1050,420" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Flowing Network Signals -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 50,330 Q 250,220 500,310 T 950,250 T 1150,320" class="signal-line" />
    <path d="M 80,90 Q 320,180 620,110 T 1120,130" class="signal-line" stroke="#a855f7" />
  </g>

  <!-- Sensor & Benchmark Constellation Nodes -->
  <g fill="#38bdf8">
    <circle cx="120" cy="95" r="4" class="pulse-node" />
    <circle cx="340" cy="65" r="5" class="pulse-node" />
    <circle cx="880" cy="80" r="4.5" class="pulse-node" />
    <circle cx="1080" cy="115" r="5" class="pulse-node" />
    <circle cx="100" cy="320" r="4" class="pulse-node" />
    <circle cx="1110" cy="330" r="5.5" class="pulse-node" />
  </g>

  <!-- Foreground Main Content Container (Guaranteed in Foreground) -->
  <g id="foreground-content">
    
    <!-- Category Tag / Badge -->
    <g transform="translate(600, 58)" text-anchor="middle">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" class="shimmer-badge" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">
        ⚡ 2026 EMBODIED AI &amp; ROBOTICS BENCHMARKS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#dropShadow)">
      Awesome Embodied AI &amp; Robotics
    </text>

    <!-- Subtitle Gradient Accent -->
    <text x="600" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="url(#accentGrad)" letter-spacing="0.2">
      Simulators, Foundation VLAs &amp; Evaluation Benchmarks
    </text>

    <!-- Subtitle Explainer -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated Commercial SaaS Platforms • GPU Physics Engines • Dex Manipulation &amp; Locomotion Suites
    </text>

    <!-- Interactive / Dynamic Feature Badges in Foreground -->
    <g transform="translate(150, 245)">
      
      <!-- Feature Card 1: GPU Simulation -->
      <g transform="translate(0, 0)">
        <rect width="205" height="68" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="28" font-size="18">🏎️</text>
        <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">GPU Physics</text>
        <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Genesis, Isaac Lab, MJX</text>
      </g>

      <!-- Feature Card 2: Dexterous & VLA -->
      <g transform="translate(230, 0)">
        <rect width="205" height="68" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="28" font-size="18">🦾</text>
        <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">VLA &amp; Manipulation</text>
        <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">LIBERO, SimplerEnv, ManiSkill</text>
      </g>

      <!-- Feature Card 3: 3D Environments -->
      <g transform="translate(460, 0)">
        <rect width="205" height="68" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="28" font-size="18">🏠</text>
        <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Embodied Arenas</text>
        <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Habitat, AI2-THOR, iGibson</text>
      </g>

      <!-- Feature Card 4: Foundation Reasoning -->
      <g transform="translate(690, 0)">
        <rect width="205" height="68" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="18" y="28" font-size="18">🧠</text>
        <text x="46" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Reasoning Exams</text>
        <text x="18" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Embodied First Exam, CALVIN</text>
      </g>
    </g>

    <!-- Bottom Metrics & Tech Stack Pills -->
    <g transform="translate(600, 360)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b">
        ⭐ Real-time Stargazer Badges • 💰 Transparent SaaS Pricing &amp; Quotas • 📊 Market Dynamics
      </text>
    </g>

  </g>
</svg>
